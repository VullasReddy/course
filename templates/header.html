{% load static %}
<header class="arshith-header">
  <div class="container-fluid px-lg-5">
    <div class="arshith-navbar-container">
      
      <!-- Left Corner: ONLY "Arshith" Logo -->
      <a href="{% url 'home' %}" class="arshith-brand-logo">
        <div class="arshith-brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <span class="arshith-brand-title">ARSHITH</span>
      </a>

      <!-- Right Side Navigation: Home -> About Us -> Explore Courses -> Register -> Login -->
      <div class="d-flex align-items-center gap-4">
        <ul class="arshith-nav-menu">
          <li>
            <a class="arshith-link {% if request.path == '/' %}active{% endif %}" href="{% url 'home' %}">
              Home
            </a>
          </li>
          <li>
            <a class="arshith-link {% if '/about' in request.path %}active{% endif %}" href="{% url 'about' %}">
              About Us
            </a>
          </li>
          <li>
            <a class="arshith-link {% if '/courses' in request.path %}active{% endif %}" href="{% url 'courses' %}">
              Explore Courses
            </a>
          </li>
        </ul>

        <!-- Action Buttons: Register & Login -->
        <div class="d-flex align-items-center gap-2">
          {% if user.is_authenticated %}
            {% if user.role == 'admin' or user.is_superuser or user.is_staff %}
              <a href="{% url 'admin-dashboard' %}" class="btn btn-sm btn-outline-success font-weight-bold">
                <i class="fa-solid fa-sliders me-1"></i> Admin Portal
              </a>
            {% endif %}
            <a href="{% url 'dashboard' %}" class="btn-arshith-reg">
              <i class="fa-solid fa-gauge"></i> Dashboard
            </a>
            <div class="dropdown">
              <button class="btn btn-sm btn-outline-dark dropdown-toggle font-weight-bold" type="button" data-bs-toggle="dropdown">
                <i class="fa-solid fa-user-circle text-success me-1"></i> {{ user.full_name|default:user.email }}
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                <li><a class="dropdown-item" href="{% url 'dashboard' %}"><i class="fa-solid fa-gauge me-2 text-success"></i> Dashboard</a></li>
                <li><a class="dropdown-item" href="{% url 'my-courses' %}"><i class="fa-solid fa-book-open me-2 text-info"></i> My Courses</a></li>
                <li><a class="dropdown-item" href="{% url 'certificates' %}"><i class="fa-solid fa-certificate me-2 text-warning"></i> Certificates</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger js-logout-btn" href="#"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</a></li>
              </ul>
            </div>
          {% else %}
            <a href="{% url 'register' %}" class="btn-arshith-reg">
              <i class="fa-solid fa-user-plus me-1"></i> Register
            </a>
            <a href="{% url 'login' %}" class="btn-arshith-log">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Login
            </a>
          {% endif %}
        </div>
      </div>

    </div>
  </div>
</header>
