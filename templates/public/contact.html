{% extends 'base.html' %}
{% block title %}Contact Support | Arshith Springboard{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="p-4 p-md-5 bg-white rounded border shadow-sm">
        <h3 class="font-weight-bold text-dark mb-3">Contact Support</h3>
        <p class="text-muted small mb-4">Have questions about Springboard courses or enterprise licensing?</p>
        <form onsubmit="event.preventDefault(); API.showToast('Message sent!', 'success');">
          <div class="mb-3">
            <label class="form-label small font-weight-bold text-muted">Full Name</label>
            <input type="text" class="form-control" placeholder="Alex Mercer" required>
          </div>
          <div class="mb-3">
            <label class="form-label small font-weight-bold text-muted">Email</label>
            <input type="email" class="form-control" placeholder="name@company.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label small font-weight-bold text-muted">Message</label>
            <textarea class="form-control" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-springboard-primary w-100">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
